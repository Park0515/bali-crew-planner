name: Stay URL price monitor
on:
  workflow_dispatch:
    inputs:
      diagnostic_only:
        description: 'DB 기록을 읽거나 저장하지 않고 Agoda 공개 표시 요금 확인'
        type: boolean
        default: false
      retry_failed:
        description: '오늘 오류·요금 검증 실패 항목만 재시도'
        type: boolean
        default: false
  schedule:
    - cron: '43 0 * * *'
permissions:
  contents: read
concurrency:
  group: stay-url-monitor
  cancel-in-progress: false
jobs:
  collect:
    if: vars.STAY_URL_MONITOR_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install page renderer
        run: |
          npm install --no-save --package-lock=false playwright@1.65.0
          npx playwright install --with-deps chromium
      - name: Read registered stay pages
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          STAY_URL_TO_REGISTER: ${{ secrets.STAY_URL_TO_REGISTER }}
          RETRY_FAILED: ${{ github.event.inputs.retry_failed || 'false' }}
          DIAGNOSTIC_ONLY: ${{ github.event.inputs.diagnostic_only || 'false' }}
        run: node scripts/check-stay-urls.mjs
