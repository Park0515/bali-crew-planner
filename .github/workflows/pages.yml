name: Deploy Bali planner to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check config.js
          node --check login-id.js
          node --check account-helper.js
          node --check flight-trends.js
          node --check flight-trends-view.js
          node --check scripts/check-flight-prices.mjs
          node --check stay-url.js
          node --check scripts/check-stay-urls.mjs
          node --test tests/login-id.test.cjs tests/single-trip.test.cjs tests/flight-trends.test.cjs tests/stay-url.test.cjs
      - name: Prepare public website files
        run: |
          mkdir _site
          cp index.html styles.css app.js config.js login-id.js account-helper.html account-helper.js flight-trends.js flight-trends-view.js stay-url.js .nojekyll _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
